[package]
name = "kotoba-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary name is what macOS shows for a bare binary.
[[bin]]
name = "Kotoba"
path = "src/main.rs"

[dependencies]
kotoba-core = { path = "../kotoba-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# The zed revision is pinned in Cargo.lock (cargo update -p gpui --precise <rev>).
# gpui-component depends on the unpinned zed source, so a `rev` here would
# produce a second copy of gpui that it does not build against.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
# The window selection layer, for ending a drag a swallowed click would leave open.
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
futures = "0.3"
# The system's preferred languages, for the window's (`i18n`).
sys-locale = "0.3"
opener = "0.7"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
objc2 = "0.6"
# The handler of an AppKit event monitor (`sys::key_events`).
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSApplication", "NSImage", "NSRunningApplication", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "NSColor", "NSSound", "NSEvent", "NSScreen", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSCell", "NSButtonCell", "NSGraphics", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL", "NSArray", "NSRange", "NSDictionary", "NSValue", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSGeometry", "NSObject", "NSRunLoop", "NSError", "NSUserDefaults", "NSBundle"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
raw-window-handle = "0.6"
# The menu's icons, drawn from the same SVGs the window draws, by the
# resvg gpui already builds.
resvg = "0.46"
# Launch at login (`sys::set_login`).
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

# The bundle: `cargo packager --release` (cargo-packager) wraps the app.
# No signing identity is set here: the bundle is signed afterwards by
# scripts/release-mac.sh.
[package.metadata.packager]
productName = "Kotoba"
identifier = "com.pingfanhu.kotoba"
description = "Dictation anywhere on this Mac: press a key, speak, and the words are written where the cursor is."
homepage = "https://github.com/alkaline-software/kotoba"
licenseFile = "../../LICENSE"
category = "Productivity"
icons = ["assets/icon/icon.icns"]
outDir = "../../dist"
binaries = [{ path = "Kotoba", main = true }]

[package.metadata.packager.macos]
minimumSystemVersion = "14.0"
# Merged into the bundle's Info.plist: no Dock icon (a menu bar app), and
# the line the system shows when it asks for the microphone. The
# entitlement that goes with it under the hardened runtime is given at
# signing (release-mac.sh).
infoPlistPath = "macos/Info.plist"
