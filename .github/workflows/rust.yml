name: rust

# The app and its core on a clean Mac: tests and a build on every push and
# pull request. The disk images are release.yml's job and only run on a
# tag, because a GPUI build is slow.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared across branches so a PR starts warm.
          shared-key: rust-macos

      - name: Tests
        run: cargo test -p kotoba-core --locked
        env:
          # Never let a CI run touch a real ~/.kotoba.
          KOTOBA_HOME: ${{ runner.temp }}/kotoba-home

      - name: Build the app
        run: cargo build -p kotoba-app -p kotoba-core --locked

      - name: The window's languages and pictures
        run: cargo test -p kotoba-app --locked

      - name: The CLI runs
        run: cargo run -p kotoba-core --locked -- dictate models
        env:
          KOTOBA_HOME: ${{ runner.temp }}/kotoba-home
