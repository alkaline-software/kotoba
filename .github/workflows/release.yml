name: release

# The Mac disk images, built only when a version tag is pushed. Each
# architecture is packaged by scripts/release-mac.sh and attached to a
# GitHub Release under a stable name, so the
# docs can link `releases/latest/download/<name>` and never go stale. The
# release's notes are the tag's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: Kotoba-mac-arm64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: Kotoba-mac-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the workspace version and has release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Cargo.toml says $v but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
          scripts/release-notes.sh "$v" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked -p kotoba-app --target ${{ matrix.target }}

      # With the certificate in the repository's secrets the bundle gets a
      # Developer ID signature, the hardened runtime, and, with the Apple ID
      # secrets too, notarization and a staple: a plain double-click install.
      # Without them (a fork, a contributor) the build is ad-hoc signed and
      # the docs' "Open Anyway" steps apply. scripts/release-mac.sh is the
      # same script a laptop release uses.
      - name: Signing identity (when the secrets are set)
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KOTOBA_SIGNED=1" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${KOTOBA_SIGNED:-}" = "1" ]; then
            NOTARIZE=""; [ -n "$APPLE_ID" ] && NOTARIZE="--notarize"
            scripts/release-mac.sh --target ${{ matrix.target }} --no-build $NOTARIZE --out dist/${{ matrix.asset }}
          else
            scripts/release-mac.sh --target ${{ matrix.target }} --no-build --identity - --out dist/${{ matrix.asset }}
          fi

      - name: Stable file names
        shell: bash
        run: |
          mkdir -p upload
          mv dist/*.dmg "upload/${{ matrix.asset }}"
          ls -la upload

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: upload/*

  # One release, made once both images are in, with the tag's section of
  # CHANGELOG.md as its notes. (Each package job making the release itself
  # left four copies of an auto-generated changelog on the page.)
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: upload
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          ls -la upload

      - uses: softprops/action-gh-release@v3
        with:
          name: Kotoba ${{ github.ref_name }}
          body_path: notes.md
          files: upload/*
          # A draft until scripts/release-publish.sh has put the notarized
          # Mac images over the ad-hoc ones built here. Published at once,
          # the page and the app's own updater handed out images macOS
          # refuses for as long as the upload was not done (v0.1.5).
          draft: true
